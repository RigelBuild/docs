name: Docs dispatch

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "**/*.webp"
      - "**/*.avif"
      - "**/*.PNG"
      - "**/*.JPG"
      - "**/*.JPEG"
      - "**/*.GIF"
      - "**/*.SVG"
      - "**/*.WEBP"
      - "**/*.AVIF"
      - "docs-bundle.toml"
jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: main
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.DOCS_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_DISPATCH_PRIVATE_KEY }}
          owner: RigelBuild
          repositories: docs
          permission-actions: write
      - name: Rebuild docs.rigel.build
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run deploy.yml --repo RigelBuild/docs --ref main
